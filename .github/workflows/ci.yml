name: CI

# Manual only. The account is on the GitHub free plan (2,000 Actions minutes a month, shared by every private
# repository) and ran out, so checks no longer run on every pull request and push. Run `pnpm format:check` and
# `pnpm check` locally before merging, and record what passed in the PR. Start this workflow by hand from the
# Actions tab when you want a clean-room run. Cloudflare
# builds and deploys the site, so there is no deploy workflow here.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch Product UI
        run: node scripts/fetch-product-ui.mjs
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_UI_TOKEN }}
      - name: Fetch app list
        run: node scripts/fetch-apps.mjs
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_UI_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
